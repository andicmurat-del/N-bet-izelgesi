name: Testler

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # tür denetimi, biçim, lint, birim testleri (motor, altın kayıt, bağımsız kural denetçisi), derleme
  birim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:denetle
      - run: npm run check
      - run: npm test
      - run: npm run artifact

  # ekran testleri: derlenmiş uygulama gerçek tarayıcıda (düğmeler, PDF / Excel, telefon görünümü, erişilebilirlik);
  # Chromium, Firefox ve WebKit (Safari motoru). Tarayıcılar ve bağımlılıkları hazır gelen resmi Playwright imajında
  # (sürüm package.json'daki @playwright/test ile aynı olmalı)
  ekran:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run e2e
        env:
          E2E_TUM_TARAYICILAR: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ekran-testleri
          path: |
            v2/playwright-report
            v2/test-results
          retention-days: 7
