name: Testler

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run artifact
