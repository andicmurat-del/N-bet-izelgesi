name: Testler

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:denetle
      - run: npm run check
      - run: npm test
      - run: npm run artifact
      # ekran testleri: derlenmiş uygulama gerçek tarayıcıda (düğmeler, PDF / Excel, telefon görünümü); Chromium,
      # Firefox ve WebKit (Safari motoru; telefon görünümü iPhone'daki gibi WebKit ile)
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
        env:
          E2E_TUM_TARAYICILAR: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ekran-testleri
          path: |
            v2/playwright-report
            v2/test-results
          retention-days: 7
