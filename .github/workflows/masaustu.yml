name: Masaüstü uygulaması (Windows)

# Windows için masaüstü uygulaması: v2/masaustu (Tauri). Program (dist/index.html) uygulamanın içine gömülür.
# Çıktılar (Actions > bu çalıştırma > Artifacts): kurulum dosyası (setup.exe, yönetici izni istemez) ve kurulmadan
# çalışan tek dosya (eczane-nobet.exe; Windows 10/11'de hazır gelen WebView2'yi kullanır).
on:
  push:
    paths:
      - "v2/**"
      - ".github/workflows/masaustu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "v2/masaustu -> target"
      - name: Dosya komutlarının testi
        run: cargo test --manifest-path masaustu/Cargo.toml
      - run: npx tauri build
      - name: Çıktıları topla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cikti | Out-Null
          Copy-Item masaustu/target/release/eczane-nobet.exe cikti/
          Copy-Item masaustu/target/release/bundle/nsis/*.exe cikti/
          Get-ChildItem cikti | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: eczane-nobet-windows
          path: v2/cikti/*.exe
          retention-days: 30
